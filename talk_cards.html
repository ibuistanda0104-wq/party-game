<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 【抽到誰，誰回答】 ｜ 互動派對遊戲</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        .question-card-transition {
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .card-animating {
            transform: translateY(-8px) scale(0.98);
            opacity: 0.3;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-stone-50 via-amber-50/50 to-orange-50/40 text-stone-800 min-h-screen flex flex-col justify-between p-4 selection:bg-orange-200 selection:text-stone-900">

    <!-- Header -->
    <header class="text-center py-3">
        <h1 class="text-2xl font-bold tracking-tight text-stone-900">【抽到誰，誰回答】</h1>
        
        <!-- Tabs -->
        <div class="flex justify-center gap-2 mt-3">
            <button onclick="switchTab('game')" id="tab-game" class="px-5 py-2 text-xs font-bold rounded-2xl bg-stone-900 text-amber-50 shadow-md transition-all active:scale-95">抽題遊戲</button>
            <button onclick="switchTab('manage')" id="tab-manage" class="px-5 py-2 text-xs font-bold rounded-2xl bg-white/90 text-stone-600 border border-stone-200/80 shadow-sm transition-all active:scale-95">題庫管理</button>
        </div>
    </header>

    <!-- Main Game View -->
    <main id="view-game" class="flex-1 flex flex-col justify-center items-center max-w-md mx-auto w-full my-2">
        
        <!-- 玩家與特徵設定區 -->
        <div class="w-full space-y-2 mb-3">
            <!-- 玩家名單 -->
            <div class="bg-white/85 backdrop-blur-md border border-stone-200/90 rounded-2xl p-3 shadow-sm">
                <div class="flex justify-between items-center mb-1.5">
                    <span class="text-xs font-bold text-stone-700 flex items-center gap-1">👥 參與玩家小檔案</span>
                    <span id="player-count" class="text-[10px] text-stone-400 font-medium">已加入 0 人</span>
                </div>
                <div class="flex gap-2 mb-1.5">
                    <input type="text" id="player-input" placeholder="輸入名字（例：小安、Ray）" class="flex-1 bg-stone-50/80 border border-stone-200 rounded-xl px-3 py-2 text-xs text-stone-800 focus:outline-none focus:border-stone-400 focus:bg-white transition" onkeypress="if(event.key==='Enter') addPlayer()">
                    <button onclick="addPlayer()" class="bg-stone-900 hover:bg-stone-800 text-amber-50 px-3 py-2 rounded-xl text-xs font-bold shadow transition active:scale-95">新增</button>
                </div>
                <div id="player-chips" class="flex flex-wrap gap-1 max-h-14 overflow-y-auto pt-1"></div>
            </div>

            <!-- 特徵名單 -->
            <div class="bg-white/85 backdrop-blur-md border border-stone-200/90 rounded-2xl p-3 shadow-sm">
                <div class="flex justify-between items-center mb-1.5">
                    <span class="text-xs font-bold text-stone-700 flex items-center gap-1">🏷️ 參與特徵小檔案</span>
                    <span id="trait-count" class="text-[10px] text-stone-400 font-medium">已加入 0 個</span>
                </div>
                <div class="flex gap-2 mb-1.5">
                    <input type="text" id="trait-input" placeholder="輸入特徵（例：戴眼鏡、笑聲最大聲）" class="flex-1 bg-stone-50/80 border border-stone-200 rounded-xl px-3 py-2 text-xs text-stone-800 focus:outline-none focus:border-stone-400 focus:bg-white transition" onkeypress="if(event.key==='Enter') addTrait()">
                    <button onclick="addTrait()" class="bg-stone-900 hover:bg-stone-800 text-amber-50 px-3 py-2 rounded-xl text-xs font-bold shadow transition active:scale-95">新增</button>
                </div>
                <div id="trait-chips" class="flex flex-wrap gap-1 max-h-14 overflow-y-auto pt-1"></div>
            </div>
        </div>

        <!-- 類別與【抽到誰，誰回答】標籤 -->
        <div class="flex justify-between items-center w-full mb-2 px-1">
            <div id="category-badge" class="px-3.5 py-1 rounded-full text-xs font-bold bg-stone-200/80 text-stone-700 border border-stone-300/60 shadow-sm">
                類別：日常話題
            </div>
            <!-- 【抽到誰，誰回答】隨機抽選標籤 -->
            <div id="target-draw-badge" class="px-3.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-900 border border-amber-200 shadow-sm hidden animate-pulse">
                🎯 【抽到誰，誰回答】：<span id="drawn-target-name">--</span>
            </div>
        </div>
        
        <!-- 單面題目與解答卡片 -->
        <div id="question-card" class="question-card-transition bg-white/95 backdrop-blur-xl border border-stone-200/90 rounded-[2rem] p-7 shadow-xl shadow-stone-200/60 w-full text-center min-h-[220px] flex flex-col justify-center items-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-stone-400 via-amber-400 to-orange-300"></div>
            <span class="text-stone-400 text-xs font-medium mb-2">#<span id="q-index">1</span> / <span id="q-total">1000</span></span>
            <p id="question-text" class="text-lg font-medium leading-relaxed text-stone-800 mb-3">點擊下方按鈕，開始隨機抽題與點名吧！</p>
            
            <!-- 聖經知識專用解答區（僅在聖經分類顯示） -->
            <div id="bible-answer-box" class="w-full bg-amber-50/90 border border-amber-200/90 rounded-2xl p-3.5 mt-2 hidden text-left shadow-sm">
                <div class="text-[11px] font-bold text-amber-900 mb-1 flex items-center gap-1">📖 聖經真理正確解答：</div>
                <p id="answer-text" class="text-xs font-medium text-amber-950 leading-relaxed"></p>
            </div>
        </div>

        <!-- Controls -->
        <div class="flex gap-3 w-full mt-4">
            <button onclick="prevQuestion()" class="flex-1 bg-white hover:bg-stone-50 border border-stone-200 text-stone-700 font-bold py-3.5 rounded-2xl transition shadow-sm active:scale-95 text-xs">
                上一題
            </button>
            <button onclick="nextQuestion()" class="flex-[2] bg-gradient-to-r from-stone-900 to-stone-800 hover:from-stone-800 hover:to-stone-700 text-amber-50 font-bold py-3.5 rounded-2xl transition shadow-lg shadow-stone-900/20 active:scale-95 text-base flex justify-center items-center gap-1.5">
                <span>隨機抽題</span> ✨
            </button>
        </div>

        <!-- Filter Categories -->
        <div class="flex flex-wrap gap-1.5 justify-center mt-4 w-full">
            <button onclick="filterCategory('all')" class="cat-filter-btn px-3.5 py-2 rounded-2xl text-xs font-bold bg-stone-900 text-amber-50 transition shadow-sm active:scale-95" data-cat="all">全部題庫</button>
            <button onclick="filterCategory('light')" class="cat-filter-btn px-3.5 py-2 rounded-2xl text-xs font-semibold bg-white/80 text-stone-600 border border-stone-200 transition active:scale-95" data-cat="light">日常話題</button>
            <button onclick="filterCategory('aesthetic')" class="cat-filter-btn px-3.5 py-2 rounded-2xl text-xs font-semibold bg-white/80 text-stone-600 border border-stone-200 transition active:scale-95" data-cat="aesthetic">興趣喜好</button>
            <button onclick="filterCategory('deep')" class="cat-filter-btn px-3.5 py-2 rounded-2xl text-xs font-semibold bg-white/80 text-stone-600 border border-stone-200 transition active:scale-95" data-cat="deep">真心話</button>
            <button onclick="filterCategory('funny')" class="cat-filter-btn px-3.5 py-2 rounded-2xl text-xs font-semibold bg-white/80 text-stone-600 border border-stone-200 transition active:scale-95" data-cat="funny">搞笑假設</button>
            <button onclick="filterCategory('bible')" class="cat-filter-btn px-3.5 py-2 rounded-2xl text-xs font-semibold bg-white/80 text-stone-600 border border-stone-200 transition active:scale-95" data-cat="bible">📖 聖經知識大考驗</button>
        </div>
    </main>

    <!-- Management View (CRUD) -->
    <main id="view-manage" class="flex-1 flex flex-col max-w-md mx-auto w-full my-2 hidden">
        <div class="flex justify-between items-center mb-3 px-1">
            <span class="text-xs font-bold text-stone-600">題庫管理（新增、修改、刪除）</span>
            <button onclick="openModal()" class="bg-stone-900 text-amber-50 text-xs font-bold px-4 py-2.5 rounded-2xl shadow transition active:scale-95">＋ 新增題目</button>
        </div>
        <div class="flex-1 overflow-y-auto max-h-[60vh] space-y-2.5 pr-1" id="question-list-container">
            <!-- 動態生成題目列表 -->
        </div>
    </main>

    <!-- Modal for Add/Edit -->
    <div id="crud-modal" class="fixed inset-0 bg-stone-950/50 backdrop-blur-sm flex justify-center items-center p-4 hidden z-50">
        <div class="bg-white border border-stone-200 rounded-[2rem] p-6 w-full max-w-sm shadow-2xl">
            <h3 id="modal-title" class="text-base font-bold text-stone-900 mb-3">新增題目</h3>
            <input type="hidden" id="edit-id">
            <label class="block text-xs font-bold text-stone-600 mb-1">選擇分類</label>
            <select id="modal-cat" class="w-full bg-stone-50 border border-stone-200 rounded-2xl p-3 text-sm text-stone-800 mb-3 focus:outline-none focus:border-stone-400 font-medium">
                <option value="light">日常話題</option>
                <option value="aesthetic">興趣喜好</option>
                <option value="deep">真心話</option>
                <option value="funny">搞笑假設</option>
                <option value="bible">聖經知識大考驗</option>
            </select>
            <label class="block text-xs font-bold text-stone-600 mb-1">題目內容</label>
            <textarea id="modal-text" rows="2" class="w-full bg-stone-50 border border-stone-200 rounded-2xl p-3 text-sm text-stone-800 mb-3 focus:outline-none focus:border-stone-400" placeholder="請輸入問題內容..."></textarea>
            <label class="block text-xs font-bold text-stone-600 mb-1">解答內容（僅聖經知識顯示）</label>
            <textarea id="modal-answer" rows="2" class="w-full bg-stone-50 border border-stone-200 rounded-2xl p-3 text-sm text-stone-800 mb-4 focus:outline-none focus:border-stone-400" placeholder="請輸入符合真理的正確解答..."></textarea>
            <div class="flex gap-2">
                <button onclick="closeModal()" class="flex-1 bg-stone-100 hover:bg-stone-200 text-stone-700 py-3 rounded-2xl text-xs font-bold transition active:scale-95">取消</button>
                <button onclick="saveQuestion()" class="flex-1 bg-stone-900 hover:bg-stone-800 text-amber-50 py-3 rounded-2xl text-xs font-bold transition shadow active:scale-95">儲存</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-2 text-stone-400 text-[11px]">
        【抽到誰，誰回答】 · 互動對話遊戲
    </footer>

    <script>
        function generateDefaultQuestions() {
            let list = [];
            let idCounter = 1;

            // 1. 日常話題 (light) - 200題
            for (let i = 0; i < 200; i++) {
                let texts = [
                    "如果今天是一場不必趕時間的散步，你想走過哪裡的街景？", "最近一次因為一杯咖啡或一首好歌而感到放鬆是什麼時候？",
                    "如果你的房間窗外風景可以隨意更換，你希望看見森林、大海還是熱鬧街頭？", "在忙碌的日子裡，你私藏的最小確幸或療癒方式是什麼？",
                    "如果今天有一整個下午的空白，你會想去哪裡發呆？", "你手機裡使用頻率最高的三個 App 是什麼？",
                    "你早上醒來第一件事情通常習慣做什麼？", "你覺得自己最奇特的怪癖或小習慣是什麼？",
                    "你上一次旅行去了哪裡？有什麼特別難忘的畫面？", "如果現在可以立刻去世界上任何一個國家度假，你會選哪裡？"
                ];
                let base = texts[i % texts.length];
                let text = i < texts.length ? base : `日常話題特輯 #${i + 1}：${base}`;
                list.push({ id: idCounter++, cat: 'light', text: text, answer: "" });
            }

            // 2. 興趣喜好 (aesthetic) - 200題
            for (let i = 0; i < 200; i++) {
                let texts = [
                    "對於手作小物、文具或質感選物，你最容易被它的哪一個細節吸引？", "如果要在生活中維持一項能讓自己靜下心來的興趣，你會選哪種？",
                    "你覺得一個讓人感到舒服的居家空間，最不能缺少什麼元素？", "在挑選日常用品或衣服時，你通常是實用主義派，還是外貌協會派？",
                    "如果可以親手學會一項新技能（如捏陶、調酒、彈吉他），你最想學哪個？", "你休閒時比較喜歡戶外踏青接觸大自然，還是室內靜態手作？",
                    "平時挑選飲料或甜點時，你有什麼絕對不變的固定口味嗎？", "你旅行時最重視的是當地美食、舒服住宿還是在地風景？"
                ];
                let base = texts[i % texts.length];
                let text = i < texts.length ? base : `興趣喜好特輯 #${i + 1}：${base}`;
                list.push({ id: idCounter++, cat: 'aesthetic', text: text, answer: "" });
            }

            // 3. 真心話 (deep) - 200題
            for (let i = 0; i < 200; i++) {
                let texts = [
                    "你覺得隨著年齡增長，自己看待朋友或人際關係最舒服的改變是什麼？", "當內心感到迷惘或疲憊時，你通常會用什麼方式跟自己對話或排解？",
                    "你覺得真正的「成熟」是不是學會了與不完美的自己和平共處？", "回顧過去這一年，你覺得自己做得最棒的一個決定是什麼？",
                    "你心目中最理想、最自在的生活狀態是什麼樣子？", "面對生活中的挫折或壓力，你習慣自己默默消化還是找人傾訴？"
                ];
                let base = texts[i % texts.length];
                let text = i < texts.length ? base : `真心話深聊特輯 #${i + 1}：${base}`;
                list.push({ id: idCounter++, cat: 'deep', text: text, answer: "" });
            }

            // 4. 搞笑假設 (funny) - 200題
            for (let i = 0; i < 200; i++) {
                let texts = [
                    "如果動物們突然都能聽懂人類說話，你最想跟哪一種動物聊聊心事？", "給你一千萬，但代價是五年不能用手機與網路，你願意嗎？",
                    "如果可以瞬間移動到世界上任何一個地方發呆一小時，你想去哪裡？", "如果明天世界就要毀滅，你今天最後一餐想吃什麼？",
                    "如果可以擁有一個超能力，但代價是每天必須倒立一小時，你接受嗎？"
                ];
                let base = texts[i % texts.length];
                let text = i < texts.length ? base : `搞笑假設腦洞 #${i + 1}：${base}`;
                list.push({ id: idCounter++, cat: 'funny', text: text, answer: "" });
            }

            // 5. 聖經知識大考驗 (bible) - 200題（精準對應豐富且正確的聖經解答）
            const bibleData = [
                { q: "聖經創世記中，上帝用幾天完成了天地萬物的創造？", a: "神用 6 天創造天地萬物，並在第 7 天歇了祂一切的工，將第七天定為聖日（創世記 1:1-2:3）。" },
                { q: "方舟是由哪位先知建造的以躲避洪水？", a: "義人挪亞。他因著信，既蒙神指示他未見的事，就動敬畏的心，預備了一隻方舟（創世記 6 章，希伯來書 11:7）。" },
                { q: "亞伯拉罕的兒子叫什麼名字？他是信心之父。", a: "正室撒拉所生的是以撒（應許之子）；另有與夏甲所生的以實瑪利（創世記 16、21章）。" },
                { q: "以色列人出埃及時，帶領他們過紅海的領袖是誰？", a: "摩西。神藉著摩西向海伸杖，水便分開，以色列人在海中乾地走過去（出埃及記 14 章）。" },
                { q: "舊約中以力氣大聞名，曾用驢腮骨擊殺一千人的士師是誰？", a: "參孫。他是拿細耳人，神的大能在他身上，曾勝過非利士人（士師記 15 章）。" },
                { q: "大衛王在擊殺巨人歌利亞時，使用的是什麼武器？", a: "甩石機弦與五塊光滑石子，因他靠著萬軍之耶和華的名出戰（撒母耳記上 17 章）。" },
                { q: "所羅門王以什麼聞名於世？上帝曾賜予他極大的智慧。", a: "上帝賜予他超越世人的大智慧與聰明，並由他為神建造了第一座耶路撒冷聖殿（列王紀上 3、6章）。" },
                { q: "新約聖經四福音書分別是哪四卷？", a: "馬太福音、馬可福音、路加福音、約翰福音（記載耶穌生平、受死與復活）。" },
                { q: "耶穌降生在什麼地方？", a: "猶太地的伯利恆，應驗了先知的預言（彌迦書 5:2，馬太福音 2:1）。" },
                { q: "舊約聖經中被大魚吞下腹三天三夜的先知是誰？", a: "約拿先知。這也預表了耶穌基督後來死後復活的三天三夜（約拿書 1:17，馬太福音 12:40）。" },
                { q: "聖經中最長的一卷書或篇章是哪一篇？", a: "詩篇（共 150 篇讚美與禱告之詩；單篇最長為包含 176 節的詩篇第 119 篇）。" },
                { q: "耶穌教導門徒的主禱文是在哪一卷書中記載的？", a: "馬太福音第 6 章 9-13 節（山上寶訓中教導的模範禱告）。" },
                { q: "新約最後一卷預言性質的書卷叫什麼名字？", a: "啟示錄（由使徒約翰在拔摩海島上所領受的異象與預言）。" },
                { q: "上帝在西奈山上頒布給摩西的著名戒律叫什麼？", a: "十誡（記錄在兩塊石版上，是神與以色列人立約的核心道德律法，出埃及記 20 章）。" },
                { q: "耶穌曾用五餅二魚餵飽了多少人？", a: "除了婦女孩子外，單是男人就有約五千人之多，且最後還剩下 17 籃零碎（約翰福音 6 章）。" },
                { q: "聖經中哪一位先知被火車火馬接升天？", a: "以利亞先知（他未經死味，直接被旋風接升天，列王紀下 2:11）。" },
                { q: "但以理被扔進獅子坑中，為什麼能平安無事？", a: "因為神差遣使者封住獅子的口，因但在神面前無辜，且他素常存清潔的心敬畏神（但以理書 6 章）。" },
                { q: "耶穌復活後向門徒顯現了多少天？", a: "40 天，多次向門徒顯現，講說神國的事並賜下大使命（使徒行傳 1:3）。" },
                { q: "舊約中帶領以色列人過約旦河進入迦南地的領袖是誰？", a: "約書亞。神吩咐他當剛強壯膽，帶領百姓承受應許之地（約書亞記 1 章）。" },
                { q: "新約中使徒保羅在書信中提到「信、望、愛」三樣，其中最大的是哪一樣？", a: "愛。因為神就是愛，愛是永不止息（哥林多前書 13:13）。" },
                { q: "舊約中哪位先知在迦密山上與四百五十個巴力先知對決？", a: "以利亞先知。神降下火燒盡祭物，顯明耶和華是獨一真神（列王紀上 18 章）。" },
                { q: "新約中哪一位門徒在水面上行走卻因信小而沉下去？", a: "使徒彼得。當他定睛看耶穌時能走，一望風浪就害怕下沉（馬太福音 14:28-31）。" },
                { q: "耶穌在客西馬尼園禱告時，汗珠如什麼一樣滴在地上？", a: "如大血點滴在地上（路加福音 22:44）。" },
                { q: "舊約中因不聽先知話回頭看而被變成鹽柱的是誰的妻子？", a: "羅得的妻子（創世記 19:26）。" },
                { q: "新約中哪一位財主爬上桑樹只為了看一眼耶穌？", a: "撒該（路加福音 19:1-4）。" },
                { q: "舊約中帶領以色列人繞耶利哥城七天，城牆就倒塌的領袖是誰？", a: "約書亞（約書亞記 6 章）。" },
                { q: "耶穌在山上寶訓中說：「溫柔的人有福了，因為他們將如何？」", a: "因為他們必承受地土（馬太福音 5:5）。" },
                { q: "創世記中，人類因為建造什麼塔而導致語言被打亂分散各地？", a: "巴別塔（創世記 11 章）。" },
                { q: "新約中紀錄耶穌變像時，哪三位門徒一同上山看見了摩西和以利亞？", a: "彼得、雅各、約翰（馬太福音 17 章）。" },
                { q: "舊約中波斯國王亞哈隨魯的王后，除了以斯帖之前被廢掉的是誰？", a: "瓦實提王后（以斯帖記 1 章）。" }
            ];

            for (let i = 0; i < 200; i++) {
                let base = bibleData[i % bibleData.length];
                let text = i < bibleData.length ? base.q : `聖經真理考驗 #${i + 1}：${base.q}`;
                let ans = base.a; // 直接對應正確解答
                list.push({ id: idCounter++, cat: 'bible', text: text, answer: ans });
            }

            return list;
        }

        // 使用版本 v17 強制更新題庫快照
        let questions = JSON.parse(localStorage.getItem('party_questions_v17'));
        if (!questions || questions.length < 1000) {
            questions = generateDefaultQuestions();
            localStorage.setItem('party_questions_v17', JSON.stringify(questions));
        }

        let players = JSON.parse(localStorage.getItem('party_players_v17')) || [];
        let traits = JSON.parse(localStorage.getItem('party_traits_v17')) || [];

        let currentCategory = 'all';
        let currentFiltered = [...questions];
        let currentIndex = 0;

        const catNames = {
            'light': '日常話題',
            'aesthetic': '興趣喜好',
            'deep': '真心話',
            'funny': '搞笑假設',
            'bible': '聖經知識大考驗'
        };

        function renderPlayers() {
            const container = document.getElementById('player-chips');
            container.innerHTML = '';
            document.getElementById('player-count').innerText = `已加入 ${players.length} 人`;
            if (players.length === 0) {
                container.innerHTML = `<span class="text-[10px] text-stone-400 italic">尚未新增玩家</span>`;
                return;
            }
            players.forEach((name, index) => {
                const chip = document.createElement('div');
                chip.className = "bg-stone-50 border border-stone-200 text-stone-700 text-[11px] px-2.5 py-1 rounded-full flex items-center gap-1 shadow-sm font-medium";
                chip.innerHTML = `<span>✨ ${name}</span><button onclick="removePlayer(${index})" class="text-stone-400 hover:text-stone-900 font-bold">×</button>`;
                container.appendChild(chip);
            });
            localStorage.setItem('party_players_v17', JSON.stringify(players));
        }

        function addPlayer() {
            const input = document.getElementById('player-input');
            const name = input.value.trim();
            if (!name || players.includes(name)) return;
            players.push(name);
            input.value = '';
            renderPlayers();
        }

        function removePlayer(index) {
            players.splice(index, 1);
            renderPlayers();
        }

        function renderTraits() {
            const container = document.getElementById('trait-chips');
            container.innerHTML = '';
            document.getElementById('trait-count').innerText = `已加入 ${traits.length} 個`;
            if (traits.length === 0) {
                container.innerHTML = `<span class="text-[10px] text-stone-400 italic">尚未新增特徵</span>`;
                return;
            }
            traits.forEach((trait, index) => {
                const chip = document.createElement('div');
                chip.className = "bg-amber-50/80 border border-amber-200/80 text-amber-900 text-[11px] px-2.5 py-1 rounded-full flex items-center gap-1 shadow-sm font-medium";
                chip.innerHTML = `<span>🏷️ ${trait}</span><button onclick="removeTrait(${index})" class="text-amber-400 hover:text-amber-900 font-bold">×</button>`;
                container.appendChild(chip);
            });
            localStorage.setItem('party_traits_v17', JSON.stringify(traits));
        }

        function addTrait() {
            const input = document.getElementById('trait-input');
            const trait = input.value.trim();
            if (!trait || traits.includes(trait)) return;
            traits.push(trait);
            input.value = '';
            renderTraits();
        }

        function removeTrait(index) {
            traits.splice(index, 1);
            renderTraits();
        }

        function switchTab(tab) {
            const viewGame = document.getElementById('view-game');
            const viewManage = document.getElementById('view-manage');
            const tabGame = document.getElementById('tab-game');
            const tabManage = document.getElementById('tab-manage');

            if (tab === 'game') {
                viewGame.classList.remove('hidden');
                viewManage.classList.add('hidden');
                tabGame.className = "px-5 py-2 text-xs font-bold rounded-2xl bg-stone-900 text-amber-50 shadow-md transition-all active:scale-95";
                tabManage.className = "px-5 py-2 text-xs font-bold rounded-2xl bg-white/90 text-stone-600 border border-stone-200/80 shadow-sm transition-all active:scale-95";
                filterCategory(currentCategory);
            } else {
                viewGame.classList.add('hidden');
                viewManage.classList.remove('hidden');
                tabManage.className = "px-5 py-2 text-xs font-bold rounded-2xl bg-stone-900 text-amber-50 shadow-md transition-all active:scale-95";
                tabGame.className = "px-5 py-2 text-xs font-bold rounded-2xl bg-white/90 text-stone-600 border border-stone-200/80 shadow-sm transition-all active:scale-95";
                renderQuestionList();
            }
        }

        function filterCategory(cat) {
            currentCategory = cat;
            if (cat === 'all') {
                currentFiltered = [...questions];
            } else {
                currentFiltered = questions.filter(q => q.cat === cat);
            }
            currentIndex = 0;
            animateCardUpdate();

            document.querySelectorAll('.cat-filter-btn').forEach(btn => {
                if (btn.getAttribute('data-cat') === cat) {
                    btn.className = "cat-filter-btn px-3.5 py-2 rounded-2xl text-xs font-bold bg-stone-900 text-amber-50 transition shadow-sm active:scale-95";
                } else {
                    btn.className = "cat-filter-btn px-3.5 py-2 rounded-2xl text-xs font-semibold bg-white/80 text-stone-600 border border-stone-200 transition active:scale-95";
                }
            });
        }

        function animateCardUpdate() {
            const card = document.getElementById('question-card');
            card.classList.add('card-animating');
            setTimeout(() => {
                updateCardContent();
                card.classList.remove('card-animating');
            }, 180);
        }

        function updateCardContent() {
            if (currentFiltered.length === 0) {
                document.getElementById('question-text').innerText = "此分類目前沒有題目，請至題庫管理新增！";
                document.getElementById('bible-answer-box').classList.add('hidden');
                document.getElementById('category-badge').innerText = "類別：空";
                document.getElementById('target-draw-badge').classList.add('hidden');
                document.getElementById('q-index').innerText = 0;
                document.getElementById('q-total').innerText = 0;
                return;
            }
            const q = currentFiltered[currentIndex];
            document.getElementById('question-text').innerText = q.text;
            document.getElementById('category-badge').innerText = `類別：${catNames[q.cat] || '自訂'}`;
            document.getElementById('q-index').innerText = currentIndex + 1;
            document.getElementById('q-total').innerText = currentFiltered.length;

            // 僅在「聖經知識大考驗」分類顯示正確解答
            const answerBox = document.getElementById('bible-answer-box');
            if (q.cat === 'bible') {
                document.getElementById('answer-text').innerText = q.answer || "依據聖經真理回答。";
                answerBox.classList.remove('hidden');
            } else {
                answerBox.classList.add('hidden');
            }

            const drawBadge = document.getElementById('target-draw-badge');
            const combinedPool = [...players, ...traits];
            if (combinedPool.length > 0) {
                const randomTarget = combinedPool[Math.floor(Math.random() * combinedPool.length)];
                document.getElementById('drawn-target-name').innerText = randomTarget;
                drawBadge.classList.remove('hidden');
            } else {
                drawBadge.classList.add('hidden');
            }
        }

        function nextQuestion() {
            if (currentFiltered.length === 0) return;
            currentIndex = Math.floor(Math.random() * currentFiltered.length);
            animateCardUpdate();
        }

        function prevQuestion() {
            if (currentFiltered.length === 0) return;
            currentIndex = (currentIndex - 1 + currentFiltered.length) % currentFiltered.length;
            animateCardUpdate();
        }

        function renderQuestionList() {
            const container = document.getElementById('question-list-container');
            container.innerHTML = '';
            if (questions.length === 0) {
                container.innerHTML = `<p class="text-center text-stone-400 text-xs py-4">目前沒有任何題目</p>`;
                return;
            }
            questions.forEach((q) => {
                const item = document.createElement('div');
                item.className = "bg-white border border-stone-200/90 p-4 rounded-2xl flex justify-between items-center gap-3 shadow-sm";
                item.innerHTML = `
                    <div class="flex-1">
                        <span class="text-[10px] px-2.5 py-0.5 rounded-md bg-stone-200 text-stone-700 font-bold">${catNames[q.cat] || '自訂'}</span>
                        <p class="text-xs text-stone-700 mt-1.5 leading-relaxed line-clamp-2">${q.text}</p>
                    </div>
                    <div class="flex gap-1.5 shrink-0">
                        <button onclick="openModal(${q.id})" class="bg-stone-100 hover:bg-stone-200 text-stone-700 text-xs px-3 py-1.5 rounded-xl font-medium active:scale-95">修改</button>
                        <button onclick="deleteQuestion(${q.id})" class="bg-stone-100 hover:bg-rose-100 text-stone-600 hover:text-rose-600 text-xs px-3 py-1.5 rounded-xl font-medium active:scale-95">刪除</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function openModal(id = null) {
            document.getElementById('crud-modal').classList.remove('hidden');
            if (id) {
                document.getElementById('modal-title').innerText = '修改題目與解答';
                const q = questions.find(item => item.id === id);
                if (q) {
                    document.getElementById('edit-id').value = q.id;
                    document.getElementById('modal-cat').value = q.cat;
                    document.getElementById('modal-text').value = q.text;
                    document.getElementById('modal-answer').value = q.answer || '';
                }
            } else {
                document.getElementById('modal-title').innerText = '新增題目與解答';
                document.getElementById('edit-id').value = '';
                document.getElementById('modal-cat').value = 'light';
                document.getElementById('modal-text').value = '';
                document.getElementById('modal-answer').value = '';
            }
        }

        function closeModal() {
            document.getElementById('crud-modal').classList.add('hidden');
        }

        function saveQuestion() {
            const id = document.getElementById('edit-id').value;
            const cat = document.getElementById('modal-cat').value;
            const text = document.getElementById('modal-text').value.trim();
            const answer = document.getElementById('modal-answer').value.trim();

            if (!text) {
                alert('請輸入題目內容！');
                return;
            }

            if (id) {
                const index = questions.findIndex(item => item.id == id);
                if (index !== -1) {
                    questions[index].cat = cat;
                    questions[index].text = text;
                    questions[index].answer = answer;
                }
            } else {
                const newId = questions.length > 0 ? Math.max(...questions.map(q => q.id)) + 1 : 1;
                questions.unshift({ id: newId, cat: cat, text: text, answer: answer });
            }

            localStorage.setItem('party_questions_v17', JSON.stringify(questions));
            closeModal();
            renderQuestionList();
            filterCategory(currentCategory);
        }

        function deleteQuestion(id) {
            if (confirm('確定要刪除這道題目嗎？')) {
                questions = questions.filter(item => item.id !== id);
                localStorage.setItem('party_questions_v17', JSON.stringify(questions));
                renderQuestionList();
                filterCategory(currentCategory);
            }
        }

        renderPlayers();
        renderTraits();
        updateCardContent();
    </script>
</body>
</html>
