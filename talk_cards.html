        </div>
    </header>

    <!-- Main Game View -->
    <main id="view-game" class="flex-1 flex flex-col justify-center items-center max-w-md mx-auto w-full my-2">

            類別：輕鬆破冰
        </div>
        
        <div id="question-card" class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl w-full text-center min-h-[220px] flex flex-col justify-center items-center transition-all duration-300">
            <span class="text-slate-500 text-xs mb-2">#<span id="q-index">1</span> / <span id="q-total">200</span></span>
            <p id="question-text" class="text-lg font-medium leading-relaxed">點擊下方按鈕，開始抽取你們的第一個話題吧！</p>
        </div>

        <!-- Controls -->
        <div class="flex gap-3 w-full mt-5">
            <button onclick="prevQuestion()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold py-3 rounded-xl transition active:scale-95 text-sm">

            </button>
            <button onclick="nextQuestion()" class="flex-[2] bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg shadow-teal-500/20 active:scale-95 text-base">
                隨機抽題 🎲
            </button>
        </div>

        <!-- Filter Categories -->
        <div class="flex flex-wrap gap-2 justify-center mt-5 w-full">
            <button onclick="filterCategory('all')" class="cat-filter-btn px-3 py-1.5 rounded-lg text-xs bg-teal-500 text-slate-950 font-semibold transition" data-cat="all">全部題庫</button>
            <button onclick="filterCategory('icebreaker')" class="cat-filter-btn px-3 py-1.5 rounded-lg text-xs bg-slate-800 text-slate-300 border border-slate-700 transition" data-cat="icebreaker">輕鬆破冰</button>
            <button onclick="filterCategory('deep')" class="cat-filter-btn px-3 py-1.5 rounded-lg text-xs bg-slate-800 text-slate-300 border border-slate-700 transition" data-cat="deep">靈魂深聊</button>
            <button onclick="filterCategory('funny')" class="cat-filter-btn px-3 py-1.5 rounded-lg text-xs bg-slate-800 text-slate-300 border border-slate-700 transition" data-cat="funny">瘋狂假設</button>
            <button onclick="filterCategory('life')" class="cat-filter-btn px-3 py-1.5 rounded-lg text-xs bg-slate-800 text-slate-300 border border-slate-700 transition" data-cat="life">生活觀點</button>
        </div>
    </main>

    <!-- Management View (CRUD) -->
    <main id="view-manage" class="flex-1 flex flex-col max-w-md mx-auto w-full my-2 hidden">
        <div class="flex justify-between items-center mb-3">
            <span class="text-xs text-slate-400">管理現有題庫（支援新增、修改、刪除）</span>

        </div>
        <div class="flex-1 overflow-y-auto max-h-[60vh] space-y-2 pr-1" id="question-list-container">
            <!-- 題目列表動態生成 -->
        </div>
    </main>

    <!-- Modal for Add/Edit -->
    <div id="crud-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex justify-center items-center p-4 hidden z-50">

            <input type="hidden" id="edit-id">
            <label class="block text-xs text-slate-400 mb-1">選擇分類</label>

            <div class="flex gap-2">

                <button onclick="saveQuestion()" class="flex-1 bg-teal-500 text-slate-950 py-2.5 rounded-xl text-sm font-bold">儲存</button>
            </div>
        </div>
    </div>

    <!-- Footer -->

        手機隨身網頁版 · 自動儲存修改

        // 從 LocalStorage 載入資料（若沒有則使用完整 200 題並寫入）
        let questions = JSON.parse(localStorage.getItem('party_questions'));

            'icebreaker': '輕鬆破冰',
            'deep': '靈魂深聊',
            'funny': '瘋狂假設',
            'life': '生活觀點'

        // 切換分頁
        function switchTab(tab) {
            const viewGame = document.getElementById('view-game');
            const viewManage = document.getElementById('view-manage');
            const tabGame = document.getElementById('tab-game');
            const tabManage = document.getElementById('tab-manage');

            if (tab === 'game') {
                viewGame.classList.remove('hidden');
                viewManage.classList.add('hidden');
                tabGame.className = "px-3 py-1 text-xs font-semibold rounded-full bg-teal-500 text-slate-950 transition";
                tabManage.className = "px-3 py-1 text-xs font-semibold rounded-full bg-slate-800 text-slate-400 border border-slate-700 transition";
                filterCategory(currentCategory);
            } else {
                viewGame.classList.add('hidden');
                viewManage.classList.remove('hidden');
                tabManage.className = "px-3 py-1 text-xs font-semibold rounded-full bg-teal-500 text-slate-950 transition";
                tabGame.className = "px-3 py-1 text-xs font-semibold rounded-full bg-slate-800 text-slate-400 border border-slate-700 transition";
                renderQuestionList();
            }
        }

        // 篩選分類與更新抽題
        function filterCategory(cat) {
            currentCategory = cat;
            if (cat === 'all') {
                currentFiltered = [...questions];
            } else {
                currentFiltered = questions.filter(q => q.cat === cat);
            }
            currentIndex = 0;
            updateCard();

            // 更新按鈕樣式
            document.querySelectorAll('.cat-filter-btn').forEach(btn => {
                if (btn.getAttribute('data-cat') === cat) {
                    btn.className = "cat-filter-btn px-3 py-1.5 rounded-lg text-xs bg-teal-500 text-slate-950 font-semibold transition";
                } else {
                    btn.className = "cat-filter-btn px-3 py-1.5 rounded-lg text-xs bg-slate-800 text-slate-300 border border-slate-700 transition";
                }
            });
        }

        function updateCard() {
            if (currentFiltered.length === 0) {
                document.getElementById('question-text').innerText = "此分類目前沒有題目，請至題庫管理新增！";
                document.getElementById('category-badge').innerText = "類別：空";
                document.getElementById('q-index').innerText = 0;
                document.getElementById('q-total').innerText = 0;
                return;
            }
            const q = currentFiltered[currentIndex];
            document.getElementById('question-text').innerText = q.text;
            document.getElementById('category-badge').innerText = `類別：${catNames[q.cat] || '自訂'}`;
            document.getElementById('q-index').innerText = currentIndex + 1;
            document.getElementById('q-total').innerText = currentFiltered.length;
        }

        function nextQuestion() {
            if (currentFiltered.length === 0) return;
            currentIndex = Math.floor(Math.random() * currentFiltered.length);
            updateCard();
        }

        function prevQuestion() {
            if (currentFiltered.length === 0) return;
            currentIndex = (currentIndex - 1 + currentFiltered.length) % currentFiltered.length;
            updateCard();
        }

        // 渲染管理清單 (CRUD: Read)
        function renderQuestionList() {
            const container = document.getElementById('question-list-container');
            container.innerHTML = '';
            if (questions.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-500 text-xs py-4">目前沒有任何題目</p>`;
                return;
            }
            questions.forEach((q, index) => {
                const item = document.createElement('div');
                item.className = "bg-slate-800 border border-slate-700 p-3 rounded-xl flex justify-between items-center gap-3";
                item.innerHTML = `
                    <div class="flex-1">
                        <span class="text-[10px] px-2 py-0.5 rounded-full bg-teal-500/20 text-teal-300 font-semibold">${catNames[q.cat] || '自訂'}</span>
                        <p class="text-xs text-slate-200 mt-1 line-clamp-2">${q.text}</p>
                    </div>
                    <div class="flex gap-1.5 shrink-0">
                        <button onclick="editQuestion(${q.id})" class="bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs px-2.5 py-1.5 rounded-lg">修改</button>
                        <button onclick="deleteQuestion(${q.id})" class="bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 text-xs px-2.5 py-1.5 rounded-lg">刪除</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // 開啟 Modal (Create / Update)
        function openModal(id = null) {
            document.getElementById('crud-modal').classList.remove('hidden');
            if (id) {
                document.getElementById('modal-title').innerText = '修改題目';
                const q = questions.find(item => item.id === id);
                if (q) {
                    document.getElementById('edit-id').value = q.id;
                    document.getElementById('modal-cat').value = q.cat;
                    document.getElementById('modal-text').value = q.text;
                }
            } else {
                document.getElementById('modal-title').innerText = '新增題目';
                document.getElementById('edit-id').value = '';
                document.getElementById('modal-cat').value = 'icebreaker';
                document.getElementById('modal-text').value = '';
            }
        }

        function closeModal() {
            document.getElementById('crud-modal').classList.add('hidden');
        }

        // 儲存題目 (Create & Update)
        function saveQuestion() {
            const id = document.getElementById('edit-id').value;
            const cat = document.getElementById('modal-cat').value;
            const text = document.getElementById('modal-text').value.trim();

            if (!text) {
                alert('請輸入題目內容！');
                return;
            }

            if (id) {
                // 修改 (Update)
                const index = questions.findIndex(item => item.id == id);
                if (index !== -1) {
                    questions[index].cat = cat;
                    questions[index].text = text;
                }
            } else {
                // 新增 (Create)
                const newId = questions.length > 0 ? Math.max(...questions.map(q => q.id)) + 1 : 1;
                questions.unshift({ id: newId, cat: cat, text: text });
            }

            localStorage.setItem('party_questions', JSON.stringify(questions));
            closeModal();
            renderQuestionList();
        }

        // 刪除題目 (Delete)
        function deleteQuestion(id) {
            if (confirm('確定要刪除這道題目嗎？')) {
                questions = questions.filter(item => item.id !== id);
                localStorage.setItem('party_questions', JSON.stringify(questions));
                renderQuestionList();
            }
        }

        // 初始化載入第一張卡片
        updateCard();
    </script>
